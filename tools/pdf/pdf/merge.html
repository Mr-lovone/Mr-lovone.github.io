<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-zh="合并PDF - 前端PDF工具箱" data-en="Merge PDF - Frontend PDF Toolbox">合并PDF - 前端PDF工具箱</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">



    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding-top: 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 导航栏 */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 功能页面 */
        .feature-header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .feature-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .feature-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .feature-content {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            background: #f7fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e6fffa;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #a0aec0;
        }

        .upload-text {
            color: #2d3748;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: #718096;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-bottom: 2rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            cursor: move;
            user-select: none;
        }

        .file-item.dragging {
            opacity: 0.5;
            transform: rotate(2deg) scale(1.05);
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .file-item.drag-over {
            border-color: #667eea;
            background: #edf2f7;
            transform: translateY(-2px);
            border-style: solid;
            border-width: 2px;
        }

        .file-item:hover:not(.dragging) {
            background: #edf2f7;
            transform: translateY(-1px);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            pointer-events: none;
        }

        .drag-handle {
            cursor: grab;
            color: #a0aec0;
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .drag-handle:hover {
            background: #e2e8f0;
            color: #667eea;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.2rem;
        }

        .file-size {
            color: #718096;
            font-size: 0.9rem;
        }

        .remove-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .remove-btn:hover {
            background: #c53030;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            width: 0%;
        }

        /* 拖拽指示器 */
        .drop-indicator {
            height: 3px;
            background: #667eea;
            border-radius: 2px;
            margin: 2px 0;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .drop-indicator.show {
            opacity: 1;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 80px;
            }

            .nav {
                padding: 0.75rem 1rem;
            }

            .logo {
                font-size: 1.25rem;
            }

            .container {
                padding: 1rem;
            }

            .feature-content {
                padding: 2rem;
            }

            .feature-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="nav">
        <a href="index.html" class="logo" data-zh="前端PDF工具箱" data-en="Frontend PDF Toolbox">前端PDF工具箱</a>
        <div class="nav-right">
            <a href="index.html" class="back-btn" data-zh="← 返回首页" data-en="← Back to Home">← 返回首页</a>
        </div>
    </nav>

    <div class="container">
        <header class="feature-header">
            <h1 class="feature-title" data-zh="合并PDF" data-en="Merge PDF">合并PDF</h1>
            <p class="feature-subtitle" data-zh="将多个PDF文件合并为一个完整的文档"
                data-en="Combine multiple PDF files into a single document">将多个PDF文件合并为一个完整的文档</p>
        </header>

        <div class="feature-content">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📎</div>
                <div class="upload-text" data-zh="点击选择文件或拖拽到此处" data-en="Click to select files or drag and drop here">
                    点击选择文件或拖拽到此处</div>
                <div class="upload-hint" data-zh="支持多个PDF格式文件，可拖拽调整合并顺序"
                    data-en="Support multiple PDF format files, drag to adjust merge order">支持多个PDF格式文件，可拖拽调整合并顺序</div>
            </div>

            <input type="file" id="fileInput" accept=".pdf" multiple>

            <div class="file-list" id="fileList"></div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <button class="btn" id="processBtn" onclick="mergeFiles()" data-zh="开始合并"
                data-en="Start Merging">开始合并</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script>
        // 语言管理
        let currentLanguage = 'zh';
        let fileData = [];
        let draggedItem = null;
        let draggedIndex = -1;

        // 检测系统语言并设置初始语言
        function initLanguage() {
            const systemLang = navigator.language || navigator.userLanguage;
            currentLanguage = systemLang.startsWith('zh') ? 'zh' : 'en';
            updateLanguage();
        }

        // 更新页面语言
        function updateLanguage() {
            const elements = document.querySelectorAll('[data-zh][data-en]');
            elements.forEach(element => {
                const text = element.getAttribute(`data-${currentLanguage}`);
                if (text) {
                    element.textContent = text;
                }
            });

            document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';
        }

        // 文件处理
        document.getElementById('fileInput').addEventListener('change', handleFiles);

        function handleFiles(event) {
            const files = Array.from(event.target.files);
            files.forEach(file => {
                if (file.type === 'application/pdf') {
                    fileData.push({
                        file: file,
                        name: file.name,
                        size: file.size
                    });
                }
            });
            updateFileList();
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            fileData.forEach((item, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.draggable = true;
                fileItem.dataset.index = index;
                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="drag-handle">⋮⋮</div>
                        <div class="file-icon">PDF</div>
                        <div class="file-details">
                            <div class="file-name">${item.name}</div>
                            <div class="file-size">${formatFileSize(item.size)}</div>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFile(${index})">删除</button>
                `;

                // 添加拖拽事件监听器
                addDragEventListeners(fileItem);
                fileList.appendChild(fileItem);
            });

            document.getElementById('processBtn').disabled = fileData.length < 2;
        }

        function addDragEventListeners(element) {
            element.addEventListener('dragstart', handleDragStart);
            element.addEventListener('dragend', handleDragEnd);
            element.addEventListener('dragover', handleDragOver);
            element.addEventListener('dragenter', handleDragEnter);
            element.addEventListener('dragleave', handleDragLeave);
            element.addEventListener('drop', handleDrop);
        }

        function handleDragStart(e) {
            draggedItem = this;
            draggedIndex = parseInt(this.dataset.index);
            this.classList.add('dragging');

            // 设置拖拽效果
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', this.outerHTML);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');

            // 清理所有拖拽相关的样式
            document.querySelectorAll('.file-item').forEach(item => {
                item.classList.remove('drag-over');
            });

            draggedItem = null;
            draggedIndex = -1;
        }

        function handleDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }

            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) {
            if (this !== draggedItem) {
                this.classList.add('drag-over');
            }
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }

            if (this !== draggedItem) {
                const dropIndex = parseInt(this.dataset.index);

                if (draggedIndex !== -1 && dropIndex !== -1) {
                    // 重新排列数组
                    const draggedFile = fileData[draggedIndex];
                    fileData.splice(draggedIndex, 1);
                    fileData.splice(dropIndex, 0, draggedFile);

                    // 更新文件列表
                    updateFileList();
                }
            }

            this.classList.remove('drag-over');
            return false;
        }

        function removeFile(index) {
            fileData.splice(index, 1);
            updateFileList();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function mergeFiles() {
            if (fileData.length < 2) return;

            const processBtn = document.getElementById('processBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            processBtn.disabled = true;
            processBtn.textContent = currentLanguage === 'zh' ? '处理中...' : 'Processing...';
            progressBar.style.display = 'block';

            try {
                const mergedPdf = await PDFLib.PDFDocument.create();

                for (let i = 0; i < fileData.length; i++) {
                    const progress = ((i + 1) / fileData.length) * 100;
                    progressFill.style.width = progress + '%';

                    const arrayBuffer = await fileData[i].file.arrayBuffer();
                    const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
                    const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
                    copiedPages.forEach((page) => mergedPdf.addPage(page));
                }

                const pdfBytes = await mergedPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged.pdf';
                a.click();

                URL.revokeObjectURL(url);

            } catch (error) {
                alert(currentLanguage === 'zh' ? '合并失败，请检查文件是否有效' : 'Merge failed, please check if files are valid');
            }

            processBtn.disabled = false;
            processBtn.textContent = currentLanguage === 'zh' ? '开始合并' : 'Start Merging';
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';
        }

        // 拖拽上传 
        const uploadArea = document.querySelector('.upload-area');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = Array.from(e.dataTransfer.files);
            files.forEach(file => {
                if (file.type === 'application/pdf') {
                    fileData.push({
                        file: file,
                        name: file.name,
                        size: file.size
                    });
                }
            });
            updateFileList();
        });

        // 页面加载完成后初始化语言
        document.addEventListener('DOMContentLoaded', function () {
            initLanguage();
        });
    </script>
    <script src="../js/footer.js"></script>
</body>

</html>

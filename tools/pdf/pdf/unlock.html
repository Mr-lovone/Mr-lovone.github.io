<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-zh="解除密码 - 前端PDF工具箱" data-en="Remove Password - Frontend PDF Toolbox">解除密码 - 前端PDF工具箱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">



    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            padding-top: 100px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 导航栏 */
        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding: 1rem 2rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* 功能页面 */
        .feature-header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .feature-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .feature-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .feature-content {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 0 auto;
        }

        .upload-area {
            border: 3px dashed #cbd5e0;
            border-radius: 16px;
            padding: 3rem;
            text-align: center;
            background: #f7fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .upload-area:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .upload-area.dragover {
            border-color: #667eea;
            background: #e6fffa;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #a0aec0;
        }

        .upload-text {
            color: #2d3748;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            color: #718096;
            font-size: 0.9rem;
        }

        input[type="file"] {
            display: none;
        }

        .file-list {
            margin-bottom: 2rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 12px;
            margin-bottom: 0.5rem;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.2rem;
        }

        .file-size {
            color: #718096;
            font-size: 0.9rem;
        }

        .remove-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .remove-btn:hover {
            background: #c53030;
        }

        /* 密码输入选项 */
        .password-options {
            background: #f7fafc;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .option-group {
            margin-bottom: 1.5rem;
        }

        .option-group:last-child {
            margin-bottom: 0;
        }

        .option-label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .password-input {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 0.5rem;
        }

        .password-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-toggle {
            margin-top: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .password-toggle input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .password-toggle label {
            font-size: 0.9rem;
            color: #4a5568;
            cursor: pointer;
        }

        .input-hint {
            font-size: 0.9rem;
            color: #718096;
            margin-top: 0.5rem;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            margin: 1rem 0;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            width: 0%;
        }

        @media (max-width: 768px) {
            body {
                padding-top: 80px;
            }

            .nav {
                padding: 0.75rem 1rem;
            }

            .logo {
                font-size: 1.25rem;
            }

            .container {
                padding: 1rem;
            }

            .feature-content {
                padding: 2rem;
            }

            .feature-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <!-- 导航栏 -->
    <nav class="nav">
        <a href="index.html" class="logo" data-zh="前端PDF工具箱" data-en="Frontend PDF Toolbox">前端PDF工具箱</a>
        <div class="nav-right">
            <a href="index.html" class="back-btn" data-zh="← 返回首页" data-en="← Back to Home">← 返回首页</a>
        </div>
    </nav>

    <div class="container">
        <header class="feature-header">
            <h1 class="feature-title" data-zh="解除密码" data-en="Remove Password">解除密码</h1>
            <p class="feature-subtitle" data-zh="移除PDF文件的密码保护限制" data-en="Remove password protection from PDF files">移除PDF文件的密码保护限制</p>
        </header>

        <div class="feature-content">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">🔓</div>
                <div class="upload-text" data-zh="点击选择文件或拖拽到此处" data-en="Click to select files or drag and drop here">点击选择文件或拖拽到此处</div>
                <div class="upload-hint" data-zh="支持受密码保护的PDF文件" data-en="Support password-protected PDF files">支持受密码保护的PDF文件</div>
            </div>

            <input type="file" id="fileInput" accept=".pdf">

            <div class="file-list" id="fileList"></div>

            <!-- 密码选项 -->
            <div class="password-options" id="passwordOptions" style="display: none;">
                <div class="option-group">
                    <label class="option-label" data-zh="PDF密码" data-en="PDF Password">PDF密码</label>
                    <input type="password" class="password-input" id="pdfPassword" data-zh-placeholder="请输入PDF密码" data-en-placeholder="Please enter PDF password" placeholder="请输入PDF密码">
                    <div class="input-hint" data-zh="需要提供正确的密码才能解除PDF保护" data-en="Correct password required to unlock PDF protection">需要提供正确的密码才能解除PDF保护</div>

                    <div class="password-toggle">
                        <input type="checkbox" id="showPassword" onchange="togglePasswordVisibility()">
                        <label for="showPassword" data-zh="显示密码" data-en="Show password">显示密码</label>
                    </div>
                </div>
            </div>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <button class="btn" id="processBtn" onclick="unlockFile()" data-zh="解除密码" data-en="Remove Password" disabled>解除密码</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    
    <script>
        // 语言管理
        let currentLanguage = 'zh';
        let pdfFile = null;

        // 检测系统语言并设置初始语言
        function initLanguage() {
            const systemLang = navigator.language || navigator.userLanguage;
            currentLanguage = systemLang.startsWith('zh') ? 'zh' : 'en';
            updateLanguage();
        }

        // 更新页面语言
        function updateLanguage() {
            const elements = document.querySelectorAll('[data-zh][data-en]');
            elements.forEach(element => {
                const text = element.getAttribute(`data-${currentLanguage}`);
                if (text) {
                    if (element.tagName === 'INPUT' && (element.type === 'text' || element.type === 'password')) {
                        element.placeholder = text;
                    } else {
                        element.textContent = text;
                    }
                }
            });

            // 更新placeholder
            const placeholderElements = document.querySelectorAll(`[data-${currentLanguage}-placeholder]`);
            placeholderElements.forEach(element => {
                const placeholder = element.getAttribute(`data-${currentLanguage}-placeholder`);
                if (placeholder) {
                    element.placeholder = placeholder;
                }
            });

            document.documentElement.lang = currentLanguage === 'zh' ? 'zh-CN' : 'en';
        }

        // 文件处理
        document.getElementById('fileInput').addEventListener('change', handleFile);

        function handleFile(event) {
            const file = event.target.files[0];
            if (file && file.type === 'application/pdf') {
                pdfFile = file;
                updateFileList();
                document.getElementById('passwordOptions').style.display = 'block';
                document.getElementById('processBtn').disabled = false;
            }
        }

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '';

            if (pdfFile) {
                const fileItem = document.createElement('div');
                fileItem.className = 'file-item';
                fileItem.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">🔒</div>
                        <div class="file-details">
                            <div class="file-name">${pdfFile.name}</div>
                            <div class="file-size">${formatFileSize(pdfFile.size)}</div>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFile()">${currentLanguage === 'zh' ? '删除' : 'Remove'}</button>
                `;
                fileList.appendChild(fileItem);
            }
        }

        function removeFile() {
            pdfFile = null;
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('passwordOptions').style.display = 'none';
            document.getElementById('processBtn').disabled = true;
            document.getElementById('pdfPassword').value = '';
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('pdfPassword');
            const showPassword = document.getElementById('showPassword');
            passwordInput.type = showPassword.checked ? 'text' : 'password';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function unlockFile() {
            if (!pdfFile) return;

            const password = document.getElementById('pdfPassword').value;
            if (!password) {
                alert(currentLanguage === 'zh' ? '请输入密码' : 'Please enter password');
                return;
            }

            const processBtn = document.getElementById('processBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');

            processBtn.disabled = true;
            processBtn.textContent = currentLanguage === 'zh' ? '处理中...' : 'Processing...';
            progressBar.style.display = 'block';
            progressFill.style.width = '50%';

            try {
                const arrayBuffer = await pdfFile.arrayBuffer();
                
                // 尝试使用密码加载PDF
                const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer, { password });
                
                progressFill.style.width = '75%';

                // 创建新的无密码PDF
                const newPdf = await PDFLib.PDFDocument.create();
                const pageIndices = pdfDoc.getPageIndices();
                const copiedPages = await newPdf.copyPages(pdfDoc, pageIndices);
                copiedPages.forEach((page) => newPdf.addPage(page));

                progressFill.style.width = '90%';

                const pdfBytes = await newPdf.save();
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = pdfFile.name.replace('.pdf', '_unlocked.pdf');
                a.click();

                URL.revokeObjectURL(url);

                progressFill.style.width = '100%';

                // 更新文件图标为解锁状态
                const fileIcon = document.querySelector('.file-icon');
                if (fileIcon) {
                    fileIcon.textContent = '🔓';
                }

            } catch (error) {
                if (error.message.includes('password') || error.message.includes('encrypted')) {
                    alert(currentLanguage === 'zh' ? '密码错误，请重新输入' : 'Incorrect password, please try again');
                } else {
                    alert(currentLanguage === 'zh' ? '解除密码失败，请检查文件是否有效' : 'Failed to remove password, please check if file is valid');
                }
            }

            processBtn.disabled = false;
            processBtn.textContent = currentLanguage === 'zh' ? '解除密码' : 'Remove Password';
            progressBar.style.display = 'none';
            progressFill.style.width = '0%';
        }

        // 拖拽上传
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                document.getElementById('fileInput').files = e.dataTransfer.files;
                handleFile({ target: { files: [file] } });
            }
        });

        // 页面加载完成后初始化语言
        document.addEventListener('DOMContentLoaded', function () {
            initLanguage();
        });
    </script>
    <script src="../js/footer.js"></script>
</body>

</html>
